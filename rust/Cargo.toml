[package]
name = "clumsymagi"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
description = "ClumsyMagi - makes your network condition on Windows significantly worse, in a managed and interactive manner. Rust+egui remake of clumsy."
license = "MIT"

[dependencies]
eframe = "0.37"
egui_plot = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
libloading = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"

[[bin]]
name = "clumsymagi"
path = "src/main.rs"
